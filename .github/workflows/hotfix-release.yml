name: Create a Hotfix Release
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    name: Release Hotfix
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'hotfix') && contains(github.event.comment.body, '/release')
    steps:
      - name: Indicate start of release
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: '+1'
      - name: Get PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            }
            core.info(`Getting PR #${request.pull_number} from ${request.owner}/${request.repo}`)
            try {
              const result = await github.rest.pulls.get(request)
              return result.data
            } catch (err) {
              core.setFailed(`Request failed with error ${err}`)
            }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ fromJson(steps.pr.outputs.result).head.sha }}
      - name: Get Hotfix version
        id: hotfix
        uses: Luscii/gha-get-hotfix-version@ac6b31cad6e7e5edd6f73d1d649bf60590a37d37 # v3.1.3
      - run: |
          echo "Hotfix version: ${{ steps.hotfix.outputs.version }}"
          echo "Hotfix ref: ${{ fromJson(steps.pr.outputs.result).head.ref }}"
      - name: Create hotfix release
        uses: comnoco/create-release-action@7dea6dc82ac9d97ced7a764aa82811451bba80e0 # v2.0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.hotfix.outputs.version }}
          release_name: ${{ steps.hotfix.outputs.version }}
          prerelease: true
          body: |
            ## 🧯🧯🧯 ${{ steps.hotfix.outputs.version }} 🧯🧯🧯

            ${{ github.event.issue.body }}
          draft: false
          commitish: ${{ fromJson(steps.pr.outputs.result).head.sha }}
      - name: Share release in comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ github.event.comment.id }}
          edit-mode: append
          append-separator: newline
          body: |
            > 🎉 **Released Hotfix [v${{ steps.hotfix.outputs.version }}](${{ steps.release.outputs.html_url }})**
          reactions-edit-mode: append
          reactions: 'hooray'
