name: Main Branch
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  administration:
    runs-on: ubuntu-latest
    steps:
      - name: Draft Release
        id: draft-release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
